<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全体の絵</title>
<style>
/* 全体の絵の型（big-picture）。中身は下の JSON だけ。型（見た目・動き）は手で変えない。外の物は読まない（file:// で動く）。 */
:root{
  color-scheme:light;
  --bg:#f7f8fa; --panel:#ffffff; --fg:#1b2330; --muted:#5a6575; --line:#d5dbe3;
  --accent:#1f5fbf; --accent-bg:#e8f0fc;
  --owner:#b4541a; --owner-bg:#fdf0e6;
  --ai:#5b3fa0; --ai-bg:#f0ebfa;
  --store:#2c7a5a; --store-bg:#e6f4ee;
  --ext:#6b7280; --ext-bg:#f1f2f4;
  --ask:#a3361c; --ask-bg:#fcebe6;
  --hit:#d97706; --hit-bg:#fff4e0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:14px}
h1{font-size:1.4rem;margin:0}
.lead{margin:2px 0 0;color:var(--muted);max-width:80ch}
.meta{font-size:.85rem;color:var(--muted)}
.must{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.must div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.lab{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.85rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid}
.tabs,.layers{display:flex;flex-wrap:wrap;gap:4px}
.tabs{border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:700;border:0;background:none;color:var(--muted);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.layers button,select{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:4px 12px;border-radius:999px;cursor:pointer}
.layers button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:900px){.view{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
.stage svg{display:block;min-width:720px;width:100%;height:auto}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:0;display:grid;gap:12px}
.side h2{font-size:1.1rem;margin:0}
.side p{margin:2px 0 0}
.intent{border-radius:8px;padding:8px 10px}
.intent.asked{background:var(--owner-bg)}
.intent.none{background:var(--ask-bg);color:var(--ask)}
.why{border-radius:8px;padding:8px 10px;background:var(--hit-bg)}
.jump{font:inherit;margin:0 6px 6px 0;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{color:var(--muted);font-size:.85rem}
g.node{cursor:pointer}
g.node:focus{outline:none}
g.node:focus rect.b,g.node.sel rect.b{stroke-width:3}
g.node text{pointer-events:none}
g.node.at rect.b{stroke:var(--hit);stroke-width:3}
g.node.cause rect.b{stroke:var(--ask);stroke-width:4}
line.e.glow{stroke:var(--hit);stroke-width:4}
.dim g.node:not(.at):not(.cause){opacity:.35}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--muted)}
td.none{color:var(--ask)}
td.asked{color:var(--owner)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;overflow-x:auto;grid-column:1/-1;display:grid;gap:12px}
.tablewrap table{min-width:760px}
ul.plist{margin:0;padding-left:1.2em}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="title"></h1>
  <p class="meta" id="meta"></p>
  <p class="lead">箱を押すと右に「何か」「記録にある理由（AI が書いた文）」「オーナーの意図」が出る。赤い点の箱は、意図をまだ聞いていない所。</p>
</header>
<div class="must">
  <div><div class="lab">意図（何のために在るか）</div><p id="intent"></p></div>
  <div><div class="lab">課題（意図と今のずれ）</div><p id="problem"></p></div>
  <div><div class="lab">完成像</div><p id="goal"></p></div>
</div>
<div class="bar" id="legend"></div>
<div class="bar"><span class="lab">層</span>
  <div class="layers" role="group" aria-label="層">
    <button data-l="intent" aria-pressed="true">意図</button>
    <button data-l="problems" aria-pressed="false">起きた問題</button>
    <button data-l="explain" aria-pressed="false">説明</button>
  </div>
  <select id="pick" aria-label="説明する問題" hidden></select>
</div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<div class="view">
  <div class="stage" id="stage"></div>
  <aside class="side" id="side" aria-live="polite"></aside>
  <div class="tablewrap" id="table" hidden></div>
</div>
</div>
<script>
const PIC=/*__BIG_PICTURE_DATA__*/null;
const TABS={ctx:'1. 全体の文脈',flow:'2. ワークフロー',arch:'3. 仕組みの構成',intent:'4. 決めた事と意図'};
const KC={owner:['--owner','--owner-bg','人（オーナー）'],ai:['--ai','--ai-bg','AI の窓'],part:['--accent','--accent-bg','部品'],store:['--store','--store-bg','置き場・記録'],ext:['--ext','--ext-bg','外の物']};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B={};PIC.boxes.forEach(b=>B[b.id]=b);
const P=PIC.problems||[];
const st={tab:'ctx',layer:'intent',p:(P[0]||{}).id};
const q=new URLSearchParams(location.search);
if(TABS[q.get('tab')])st.tab=q.get('tab');
if(['intent','problems','explain'].includes(q.get('layer')))st.layer=q.get('layer');
if(q.get('p')&&P.some(p=>p.id===q.get('p')))st.p=q.get('p');
const $=id=>document.getElementById(id);
const stage=$('stage'),side=$('side'),table=$('table'),pick=$('pick');
const m=PIC.meta;
$('title').textContent=m.title;document.title=m.title;
$('meta').textContent=(m.kind==='合意'?`合意した版 ${m.version}（${m.agreed.by} ${m.agreed.date}・${m.agreed.record}）`:`実物の絵（${m.drawn_from} から ${m.drawn_by}）`);
$('intent').textContent=m.intent||'まだ聞いていない。設計の初めに AI が問う所。';$('problem').textContent=m.problem;$('goal').textContent=m.goal;
$('legend').innerHTML=Object.values(KC).map(c=>`<span><span class="sw" style="border-color:var(${c[0]});background:var(${c[1]})"></span>${c[2]}</span>`).join('')+'<span>点線の枠＝共通／個別の境</span>';
$('tabs').innerHTML=Object.entries(TABS).map(([k,t])=>`<button role="tab" data-v="${k}" aria-selected="false">${t}</button>`).join('');
pick.innerHTML=P.map(p=>`<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('');
const probsAt=id=>P.filter(p=>(p.at||[]).includes(id)||p.cause===id);
function rectEdge(b,tx,ty){const cx=b.x+b.w/2,cy=b.y+b.h/2,dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return[cx,cy];const s=Math.min(Math.abs((b.w/2)/(dx||1e-9)),Math.abs((b.h/2)/(dy||1e-9)));return[cx+dx*s,cy+dy*s]}
function arrow(a){const f=B[a.from],t=B[a.to];const[x1,y1]=rectEdge(f,t.x+t.w/2,t.y+t.h/2),[x2,y2]=rectEdge(t,f.x+f.w/2,f.y+f.h/2);
 return `<line class="e" data-f="${esc(a.from)}" data-t="${esc(a.to)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ah)"/>`+(a.label?`<text x="${(x1+x2)/2+6}" y="${(y1+y2)/2-4}" font-size="12" fill="var(--muted)">${esc(a.label)}</text>`:'')}
function box(b){const c=KC[b.k];const n=probsAt(b.id).length;let mark='';
 if(st.layer==='intent'&&m.kind==='合意'&&!b.intent)mark=`<circle cx="${b.x+b.w-8}" cy="${b.y+8}" r="5" fill="var(--ask)"/>`;
 if(st.layer!=='intent'&&n)mark=`<circle cx="${b.x+b.w-4}" cy="${b.y+4}" r="10" fill="var(--hit)"/><text x="${b.x+b.w-4}" y="${b.y+8}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${n}</text>`;
 return `<g class="node" tabindex="0" role="button" data-id="${esc(b.id)}" aria-label="${esc(b.t)}"><rect class="b" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="var(${c[1]})" stroke="var(${c[0]})" stroke-width="1.5"/>
 <text x="${b.x+b.w/2}" y="${b.y+b.h/2+5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">${esc(b.t)}</text>${mark}</g>`}
function svg(tab){const T=(PIC.tabs||{})[tab]||{};const bs=PIC.boxes.filter(b=>b.tab===tab);
 const W=T.w||Math.max(...bs.map(b=>b.x+b.w))+20,H=T.h||Math.max(...bs.map(b=>b.y+b.h))+20;
 const lanes=(T.lanes||[]).map((l,i)=>`<rect x="0" y="${l.y}" width="${W}" height="${l.h}" fill="${i%2?'var(--bg)':'var(--panel)'}" stroke="var(--line)"/><text x="12" y="${l.y+22}" font-size="13" font-weight="700" fill="var(--muted)">${esc(l.t)}</text>`).join('');
 const areas=(T.areas||[]).map(a=>{const c=KC[a.k]||KC.part;return `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="12" fill="none" stroke="var(${c[0]})" stroke-dasharray="6 5"/><text x="${a.x+14}" y="${a.y+22}" font-size="13" fill="var(${c[0]})" font-weight="700">${esc(a.t)}</text>`}).join('');
 const ids=new Set(bs.map(b=>b.id));
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(TABS[tab])}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>${lanes}${areas}${(PIC.arrows||[]).filter(a=>ids.has(a.from)).map(arrow).join('')}${bs.map(box).join('')}</svg>`}
function jump(id){const b=B[id];if(!b)return;st.tab=b.tab;draw();show(id)}
function link(id){const b=B[id];return `<button class="jump" data-j="${esc(id)}">${esc(b.t)}${b.tab===st.tab?'':'（'+esc(TABS[b.tab])+'）'}</button>`}
function rel(b){let h='';const kids=PIC.boxes.filter(x=>x.in===b.id);
 if(b.in&&B[b.in])h+=`<div><div class="lab">入っている箱</div><p>${link(b.in)}</p></div>`;
 if(kids.length)h+=`<div><div class="lab">中にある箱</div><p>${kids.map(x=>link(x.id)).join(' ')}</p></div>`;
 if((b.see||[]).length)h+=`<div><div class="lab">別のタブで関わる箱</div><p>${b.see.filter(i=>B[i]).map(link).join(' ')}</p></div>`;
 return h}
function boxSide(id){const b=B[id];const ps=probsAt(id);const p=P.find(x=>x.id===st.p);
 const intent=`<div class="intent ${b.intent?'asked':'none'}"><div class="lab">オーナーの意図</div><p>${esc(b.intent||'まだ聞いていない。設計の初めに AI が問う所。')}</p></div>`;
 let html=`<h2>${esc(b.t)}</h2><div><div class="lab">何か</div><p>${esc(b.what)}</p></div><div><div class="lab">記録にある理由（AI が書いた文）</div><p>${esc(b.why)}</p></div><div class="lab">境: ${esc(b.side)}${b.role?'・人が'+esc(b.role)+'所':''}</div>`+rel(b);
 if(st.layer==='explain'&&p&&p.cause===id){html+=`<div class="pair">${intent}<div class="why"><div class="lab">なぜここから起きたか（${p.origin==='構造'?'構造から来る':'単発'}）</div><p>${esc(p.why_here)}</p></div></div>`}else if(st.layer==='explain'&&p&&p.at.includes(id)){html+=`<div class="pair">${intent}<div class="why"><div class="lab">課題（この意図とのずれ＝起きた事）</div><p>${esc(p.title)}</p></div></div>`}else html+=intent;
 if(ps.length)html+=`<div><div class="lab">この箱で起きた問題（${ps.length} 件）</div><ul class="plist">${ps.map(x=>`<li>${esc(x.date)} ${esc(x.title)}（${x.cause===id?'原因':'起きた所'}・${esc(x.origin)}）</li>`).join('')}</ul></div>`;
 return html}
function show(id){stage.querySelectorAll('g.node').forEach(g=>g.classList.toggle('sel',g.dataset.id===id));side.innerHTML=boxSide(id);side.querySelectorAll('button.jump').forEach(x=>x.addEventListener('click',()=>jump(x.dataset.j)))}
function explainMarks(){const p=P.find(x=>x.id===st.p);if(st.layer!=='explain'||!p)return;
 stage.querySelector('svg')&&stage.querySelector('svg').classList.add('dim');
 stage.querySelectorAll('g.node').forEach(g=>{const id=g.dataset.id;g.classList.toggle('at',(p.at||[]).includes(id));g.classList.toggle('cause',p.cause===id)});
 const path=[p.cause,...(p.via||[]).filter(v=>v!==p.cause),...(p.at||[])];const hops=new Set();for(let i=0;i<path.length-1;i++){hops.add(path[i]+'>'+path[i+1]);hops.add(path[i+1]+'>'+path[i])}
 stage.querySelectorAll('line.e').forEach(l=>l.classList.toggle('glow',hops.has(l.dataset.f+'>'+l.dataset.t)));
 const here=B[p.cause].tab===st.tab;
 side.innerHTML=`<h2>${esc(p.title)}</h2><p class="hint">${esc(p.date)}・原因の箱は「${esc(B[p.cause].t)}」（${esc(TABS[B[p.cause].tab])}）${here?'':'＝別のタブ'}。原因の箱を押すと、意図と「なぜここから」が並ぶ。</p><div class="why"><div class="lab">なぜここから起きたか（${p.origin==='構造'?'構造から来る':'単発'}）</div><p>${esc(p.why_here)}</p></div>`}
function intentTable(){const rows=PIC.boxes.map(b=>`<tr><td><b>${esc(b.t)}</b><br><span class="hint">${esc(TABS[b.tab])}・${esc(b.side)}${b.role?'・人が'+esc(b.role):''}</span></td><td>${esc(b.what)}</td><td>${esc(b.why)}</td><td class="${b.intent?'asked':'none'}">${esc(b.intent||'まだ聞いていない')}</td></tr>`).join('');
 let h=`<table><thead><tr><th>部品・段</th><th>何か</th><th>記録にある理由（AI が書いた文）</th><th>オーナーの意図</th></tr></thead><tbody>${rows}</tbody></table>`;
 if(P.length)h+=`<table><thead><tr><th>起きた問題</th><th>起きた所</th><th>原因の箱</th><th>なぜここから</th></tr></thead><tbody>${P.map(p=>`<tr><td>${esc(p.date)} ${esc(p.title)}</td><td>${(p.at||[]).map(i=>esc(B[i].t)).join('・')}</td><td>${esc(B[p.cause].t)}（${esc(p.origin)}）</td><td>${esc(p.why_here)}</td></tr>`).join('')}</tbody></table>`;
 return h}
function draw(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===st.tab));
 document.querySelectorAll('.layers button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===st.layer));
 pick.hidden=st.layer!=='explain'||!P.length;pick.value=st.p||'';
 if(st.tab==='intent'){stage.hidden=side.hidden=true;table.hidden=false;table.innerHTML=intentTable();return}
 stage.hidden=side.hidden=false;table.hidden=true;stage.innerHTML=svg(st.tab);
 side.innerHTML=st.layer==='problems'?`<h2>起きた問題の層</h2><p class="hint">橙の数＝その箱が起きた所か原因の問題の数（全 ${P.length} 件）。</p>`:st.layer==='explain'&&!P.length?'<h2>説明する問題がまだ無い</h2>':'<h2>箱を押してください</h2><p class="hint">赤い点の箱は、オーナーの意図をまだ聞いていない所です。</p>';
 explainMarks();
 stage.querySelectorAll('g.node').forEach(g=>{g.addEventListener('click',()=>show(g.dataset.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g.dataset.id)}})})}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{st.tab=b.dataset.v;draw()}));
document.querySelectorAll('.layers button').forEach(b=>b.addEventListener('click',()=>{st.layer=b.dataset.l;draw()}));
pick.addEventListener('change',()=>{st.p=pick.value;const p=P.find(x=>x.id===st.p);if(p)st.tab=B[p.cause].tab;draw()});
draw();
</script>
</body>
</html>
