name: tag

# main に入るたびに、次の版の印（git の tag）を打つ（小の位を 1 上げる）。
# 決め方は scripts/release/next_tag.py、型は docs/版の出し方.md。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "手で回す口: 中・大の位を上げる時の版の名 vX.Y.Z（今の main の先端に打つ）"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    # 手で回す時に main 以外の枝を選んでも、main に無い commit に印を打たない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # push は checkout が持たせる GITHUB_TOKEN だけで打つ（他の秘密は使わない）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 次の版の印を打つ
        # 手で回す口の入力は run に直に埋めず env で渡す（入れ込みを防ぐ）。
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          plan="$(python3 scripts/release/next_tag.py --version "${IN_VERSION:-}")"
          echo "## 版の印" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$plan" ]; then
            echo "打つ印は無い（この commit には印が既にある）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r ver sha <<< "$plan"
          msg="$(git log -1 --format=%s "$sha")"
          git tag -a "$ver" "$sha" -m "$ver" -m "$msg"
          git push origin "refs/tags/$ver"
          echo "| $ver | \`${sha:0:12}\` | $msg |" >> "$GITHUB_STEP_SUMMARY"
