name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 試験の道具を入れる
        run: python3 -m pip install --quiet pytest
      - name: 検査（入口は check_all の 1 本）
        env:
          AF_DENY_WORDS: ${{ secrets.AF_DENY_WORDS }}
        run: bash scripts/check_all.sh
