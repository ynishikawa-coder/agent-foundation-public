name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # node（qa-html の検査 check.mjs）と playwright（型の JS を実ブラウザで動かす試験）を入れる。
      # 無いと試験が飛び、試験が飛ぶ。
      # pytest の版は scripts/requirements.txt の 1 か所。
      # python と node の playwright は同じ版に揃える。両者の版が同じでも求めるブラウザの build が違う事があるので、
      # ブラウザはそれぞれの playwright で入れる。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 試験の道具を入れる
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt playwright==1.65.1
          npm install -g --silent playwright@1.65.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          python3 -m playwright install --with-deps chromium
          node "$(npm root -g)/playwright/cli.js" install chromium
      - name: 検査（入口は check_all の 1 本）
        run: bash scripts/check_all.sh


  # 公開の検査（docs/公開の検査.md）。他の公開 repo と同じ action を、この repo では今の枝の物で呼ぶ。
  # job の名 public-guard を変えない（main の守りの必須の検査と、見回りがこの名で見る）。
  public-guard:
    name: public-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./public-guard
        with:
          checkout: "false"
          deny-bundle: ${{ secrets.AF_DENY_BUNDLE }}
          deny-words: ${{ secrets.AF_DENY_WORDS }}
          deny-words-file: tests/data/denylist.txt
          pattern-skip: public-guard/guard.py tests/test_public_guard.py plugins/core/古い形.json

  # 入れて起動する試験（scripts/plugin_smoke.py）。土台は版で止めず main の先端を配るので、合流の前に
  # 使う側と同じ入れ方（docs/核の届け方.md の setup script の塊を、目録だけ GitHub の <repo>#<枝> に替えてそのまま回す）で入れて窓を起動し、
  # 核の差し込み・守りの hook・skill の読み込みを見る。鍵は使わない（API の行き先は閉じた口）。
  # job の名 plugin-smoke を変えない（main の守りの必須の検査と、見回りがこの名で見る）。
  plugin-smoke:
    name: plugin-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 2 つの木を別の所に checkout する（tests/test_plugin_smoke_merged_tree.py が形を照らす）。
      # - 作業の dir の根: 合流した後の木（pull_request では GitHub が PR の枝に main を合わせた commit＝github.sha・
      #   ref を書かない）。本物の claude を要る試験はここで回す＝PR の枝と main の変更が合わさって初めて壊れる
      #   組み合わせを合流の前に見つける。
      # - pr-head: 入れる commit（PR の枝の先端）。GitHub から入れる試験の期待の文はこの正本で作る（合わせた木で
      #   作ると、入った copy と差し込む口が食い違う）。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 道具を入れる（使う側の窓と同じ claude の命令）
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt
          npm install -g --silent @anthropic-ai/claude-code
          claude --version
      - name: PR の枝（main への push は main）を使う側と同じ入れ方で入れて起動する
        # 枝の名は外から来る値なので run に直に埋めず env で渡す。
        env:
          SRC_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SRC_REF: ${{ github.head_ref || github.ref_name }}
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 pr-head/scripts/plugin_smoke.py --repo pr-head --source "${SRC_REPO}#${SRC_REF}" --expect-sha "${SRC_SHA}"
      - name: 根の木が PR の枝に main を合わせた commit か確かめる（親の 1 つが PR の枝の先端）
        if: github.event_name == 'pull_request'
        env:
          MERGED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${MERGED_SHA}"
          git cat-file -p HEAD | grep -qx "parent ${HEAD_SHA}"
      - name: 本物の claude を要る試験（印 real_claude の試験を全部拾う。file を手で並べない・tests/conftest.py）
        env:
          AF_REQUIRE_CLAUDE: "1"
        run: python3 -m pytest -q -m real_claude tests/
