name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 核と細目の増え方を origin/main との分かれ目と比べる（scripts/checks/kaku_growth.sh）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 試験の道具を入れる
        run: python3 -m pip install --quiet pytest
      - name: 検査（入口は check_all の 1 本）
        run: bash scripts/check_all.sh

  # 公開の検査（docs/公開の検査.md）。他の公開 repo と同じ action を、この repo では今の枝の物で呼ぶ。
  # job の名 public-guard を変えない（main の守りの必須の検査と、見回りがこの名で見る）。
  public-guard:
    name: public-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./public-guard
        with:
          checkout: "false"
          deny-bundle: ${{ secrets.AF_DENY_BUNDLE }}
          deny-words: ${{ secrets.AF_DENY_WORDS }}
          deny-words-file: tests/data/denylist.txt
          pattern-skip: public-guard/guard.py tests/test_public_guard.py

  # 入れて起動する試験（scripts/plugin_smoke.py）。土台は版で止めず main の先端を配るので、合流の前に
  # 使う側と同じ入れ方（GitHub の <repo>#<枝> から marketplace add → plugin install）で入れて窓を起動し、
  # 核の差し込み・守りの hook・skill の読み込みを見る。鍵は使わない（API の行き先は閉じた口）。
  # job の名 plugin-smoke を変えない（main の守りの必須の検査と、見回りがこの名で見る）。
  plugin-smoke:
    name: plugin-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 道具を入れる（使う側の窓と同じ claude の命令）
        run: |
          python3 -m pip install --quiet pytest
          npm install -g --silent @anthropic-ai/claude-code
          claude --version
      - name: PR の枝（main への push は main）を使う側と同じ入れ方で入れて起動する
        # 枝の名は外から来る値なので run に直に埋めず env で渡す。
        env:
          SRC_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SRC_REF: ${{ github.head_ref || github.ref_name }}
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/plugin_smoke.py --source "${SRC_REPO}#${SRC_REF}" --expect-sha "${SRC_SHA}"
      - name: 試験の歯（届かない物をわざと入れた写しで赤になるか）
        env:
          AF_REQUIRE_CLAUDE: "1"
        run: python3 -m pytest -q tests/test_plugin_smoke.py
