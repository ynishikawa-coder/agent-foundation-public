name: merge-gate
# 合流の関所（plugins/checker/scripts/merge_gate.py）。今の先端に書いた窓と別の窓の green が在るかを、
# PR の本文・commit・コメントから機械で照らし、先端の commit の状態 `merge-gate` に書く。
# 判定のコメントが付いた時・先端が動いた時・本文が直った時に回る。合流の窓は `merge-gate` が success の PR だけを入れる。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  gate:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # 照らす道具は main の物（PR の枝が道具を書き換えて自分を通せない）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 照らして先端の状態に書く
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 plugins/checker/scripts/merge_gate.py --github "${{ github.repository }}" --pr "${PR_NUMBER}" --status
