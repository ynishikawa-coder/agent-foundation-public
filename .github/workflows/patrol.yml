name: patrol

# 公開の repo の見回り（public-guard/patrol.py・docs/公開の検査.md）。
# 検査の呼び口が無い・main の守りで検査が必須でない公開 repo を見つけたら、この repo の issue「公開の検査の見回り」で知らせ、赤で終わる。
on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 06:17 日本時間（cron は UTC で書く）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 見回る
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 public-guard/patrol.py --report-issue
