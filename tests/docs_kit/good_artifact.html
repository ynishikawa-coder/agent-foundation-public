<!-- 確認のページ（Artifact）の形の見本: 公開の時に骨組みが包まれるので body を書かず、ページの根の要素に宛先の印を付ける -->
<main data-dest="artifact">
<header><div class="ey">オーナーへの確認</div><h1>備品の貸し出しの決め方</h1><p>貸し出しの決まりで確かめたい事が 1 件あります。</p></header>
<form>
<fieldset class="q" data-qkey="q1" data-qlabel="返す期限" data-kind="judge">
<legend>1. 返す期限は、どう決めますか</legend>
<div class="known">今は期限が決まっていません。</div>
<div class="opts">
<label class="opt"><input type="radio" name="q1" value="A"><span><b>借りた日から 7 日<span class="tag-rec">推奨</span></b><small>多くの備品はこれで足ります</small></span></label>
<label class="opt"><input type="radio" name="q1" value="B"><span><b>借りた日から 14 日</b></span></label>
<label class="opt"><input type="radio" name="q1" value="other"><span><b>別の決め方（補足に）</b></span></label>
</div>
<p class="decides">返す期限の知らせを出す日</p>
<div class="supp"><label for="supp_q1">補足（自由に）</label><textarea id="supp_q1" name="supp_q1" rows="2"></textarea></div>
</fieldset>
<fieldset class="q free" data-qkey="__自由記入__" data-qlabel="ほかに伝えたい事"><legend>ほかに伝えたい事（任意）</legend><textarea name="__自由記入__" rows="3"></textarea></fieldset>
<button type="submit">回答を送る</button>
</form>
</main>
